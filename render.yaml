# render.yaml — Configuration de déploiement Render pour Flashcard Tortue
services:
  - type: web
    name: flashcard-tortue
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Les valeurs sont saisies dans le Dashboard Render (Service → Environment).
      # `sync: false` = Render demande la valeur au déploiement sans l'écrire ici.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
